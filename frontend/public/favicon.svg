<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="syncspace-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#53C557"/>
      <stop offset="100%" stop-color="#0E9488"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background rounded badge matching the navbar brand logo -->
  <rect width="64" height="64" rx="16" fill="url(#syncspace-logo-grad)"/>

  <!-- Centered SyncSpace 3-layer isometric planes icon -->
  <g transform="translate(11, 11) scale(1.75)" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top layer plane with subtle translucent surface -->
    <path d="M12 2L2 7l10 5 10-5-10-5z" fill="rgba(255, 255, 255, 0.18)"/>
    <!-- Middle layer plane -->
    <path d="M2 12l10 5 10-5"/>
    <!-- Bottom layer plane -->
    <path d="M2 17l10 5 10-5"/>
  </g>
</svg>